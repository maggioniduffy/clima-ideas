# F5.10 (plan/05): forecast IVT from GEFSv12 reforecast pressure levels (q, u, v x 8 levels x 4 steps)
# for the F5.1 cases (202 events + 202 controls, valid 2000-2019), control member c00 only, leads 1-10.
# Manual, plus one run when this file changes on the work branch. Job `cases` takes cases.parquet from
# the F5.1 data branch `data/f51-forecasts`; the matrix job `fetch` runs one shard per runner
# (`clima-nqn hindcast fetch --variable ivt --members c00 --shard i/n`, byte-range reads of the GEFS
# reforecast mirror on AWS, anonymous); job `combine` merges the shards and commits
# gefs-reforecast-ivt.zarr + cases.parquet + README to the orphan branch `data/f510-ivt`
# (force-pushed, like F5.1).
# Measured 2026-11-22 (4 cores): ~2.1 s, ~52 requests and ~39 MB per (case, lead) entry; 404 cases x 10
# leads = 4040 entries, so 32 shards of ~126 entries take ~4.5 min each (~14 min on a runner 3x slower).
name: Hindcast IVT (F5.10)

on:
  workflow_dispatch:
    inputs:
      n_shards:
        description: "Shards (1-64)"
        default: "32"
  push: # one full run from the work branch (dispatch needs the file on main)
    branches: [fm/nice-maxwell-iiumsl]
    paths: [.github/workflows/hindcast-ivt.yml]

permissions:
  contents: write
  actions: read

env:
  CASES_BRANCH: data/f51-forecasts
  OUT_BRANCH: data/f510-ivt

jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan the matrix
        id: plan
        env:
          N_SHARDS: ${{ inputs.n_shards || '32' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          n = os.environ["N_SHARDS"]
          if not re.fullmatch(r"\d+", n) or not 1 <= int(n) <= 64:
              sys.exit(f"invalid n_shards: {n!r}")
          rows = [{"shard": i, "n": int(n)} for i in range(1, int(n) + 1)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": rows}) + "\n")
          PY
      - name: Take the cases from the F5.1 data branch
        run: |
          git fetch --depth=1 origin "$CASES_BRANCH"
          mkdir -p backend
          git show FETCH_HEAD:cases.parquet > backend/cases.parquet
      - uses: actions/upload-artifact@v7
        with:
          name: hindcast-ivt-cases
          path: backend/cases.parquet
          retention-days: 30

  fetch:
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cases.outputs.matrix) }}
    name: fetch ivt ${{ matrix.shard }}/${{ matrix.n }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v7
        with:
          name: hindcast-ivt-cases
          path: backend/cases
      - name: Fetch this shard
        run: |
          uv run clima-nqn hindcast fetch --model gefs-reforecast --variable ivt --members c00 \
            --cases cases/cases.parquet --out shards --shard "${{ matrix.shard }}/${{ matrix.n }}" \
            --workers 16 --batch-cases 8
      - uses: actions/upload-artifact@v7
        with:
          name: hindcast-ivt-shard-${{ matrix.shard }}-of-${{ matrix.n }}
          path: backend/shards
          retention-days: 30

  combine:
    needs: [cases, fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v7
        with:
          name: hindcast-ivt-cases
          path: backend/cases
      - uses: actions/download-artifact@v7
        with:
          pattern: hindcast-ivt-shard-*
          merge-multiple: true
          path: backend/shards
      - name: Combine shards
        run: |
          mkdir -p out
          uv run clima-nqn hindcast combine --model gefs-reforecast --variable ivt --in shards --out out
          cp cases/cases.parquet out/cases.parquet
          du -sh out/*
      - name: Commit to the data branch
        run: |
          cd out
          git init -q -b "$OUT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > README.md <<EOF
          F5.10 forecast IVT (plan/05-hindcast.md), built by .github/workflows/hindcast-ivt.yml
          run ${GITHUB_RUN_ID}. Not code; can be deleted after use.
          Files: gefs-reforecast-ivt.zarr (variable ivt: case, lead, member, lat, lon; kg m-1 s-1; member c00
          only; lat -41..-36, lon -71.5..-68 at 0.25 deg; \`status\` marks ok / not published / error per
          entry; attrs hold source, license, period, levels, steps and counts) and cases.parquet (the F5.1
          event and control days, copied from branch ${CASES_BRANCH}).
          IVT = |Q|, Q = (1/g) integral of q (u, v) dp over 1000, 925, 850, 700, 600, 500, 400 and 300 hPa
          (trapezoid in Pa, g = 9.80665). Lead L: mean of |Q| at forecast hours 24(L-1)+6, +12, +18 and
          24L of the 00 UTC run; valid_date = init_date + L - 1.
          Source: NOAA GEFSv12 reforecast (noaa-gefs-retrospective, SPFH/UGRD/VGRD pressure-level files;
          NODD: open, attribution requested, no NOAA endorsement implied).
          EOF
          git add -A
          git commit -qm "data: F5.10 forecast IVT from run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$OUT_BRANCH"
