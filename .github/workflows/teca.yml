name: TECA / BARD

# Manual only: builds TECA and (optionally) runs BARD over one or many years of ERA5, one parallel job per year,
# keeping a Neuquen crop of the output.
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'ERA5 years (1940-2026): "2023", "1980-2025" or "1980-1985,1990"'
        default: "2023"
        type: string
      run_bard:
        description: "Run BARD after the build"
        default: false
        type: boolean
      months:
        description: 'Months to fetch, e.g. "1-12", "3" or "1,2,5-7"'
        default: "1-12"
        type: string
      source:
        description: "ERA5 source: arco (public ARCO-ERA5 on Google Cloud, no queue) or cds (Copernicus CDS API)"
        default: arco
        type: choice
        options:
          - arco
          - cds
      area:
        description: 'Area N,W,S,E in degrees (W/E in -180..180); full circle example "-10,-180,-80,179.75"'
        default: "-10,-180,-80,179.75"
        type: string
      hours:
        description: "UTC hours to download"
        default: "00,06,12,18"
        type: choice
        options:
          - "00,06,12,18"
          - "00,12"
          - "00,03,06,09,12,15,18,21"
      keep_full:
        description: "Also upload the full (uncropped) BARD output as an artifact"
        default: false
        type: boolean

permissions:
  contents: read

# One run per ref at a time: parallel dispatches would race on the CDS quota and the caches.
concurrency:
  group: teca-${{ github.ref }}
  cancel-in-progress: false

env:
  TECA_TAG: "6.0.0"
  # Absolute path: actions/cache rejects paths containing "..".
  TECA_PREFIX: /home/runner/teca-install
  # Single-node runs: use the ob1 PML instead of UCX, which fails on hosted runners.
  OMPI_MCA_pml: ob1
  OMPI_MCA_osc: ^ucx

defaults:
  run:
    shell: bash -el {0}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      years: ${{ steps.parse.outputs.years }}
      single: ${{ steps.parse.outputs.single }}
    steps:
      - name: Parse years
        id: parse
        env:
          YEARS: ${{ inputs.years }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          text = os.environ["YEARS"].replace(" ", "")
          years = set()
          try:
              for part in filter(None, text.split(",")):
                  lo, _, hi = part.partition("-")
                  years.update(range(int(lo), int(hi or lo) + 1))
          except ValueError:
              sys.exit(f"::error::invalid years {text!r}")
          if not years or min(years) < 1940 or max(years) > 2026:
              sys.exit(f"::error::years must be non-empty and within 1940..2026, got {text!r}")
          years = sorted(years)
          print("years=" + json.dumps(years))
          print("single=" + ("true" if len(years) == 1 else "false"))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/teca/environment.yml
          environment-name: teca
          cache-environment: true
          init-shell: bash

      - name: Restore TECA install
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TECA_PREFIX }}
          key: teca-${{ env.TECA_TAG }}-generic-${{ hashFiles('tools/teca/environment.yml') }}

      - name: Restore ccache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-${{ env.TECA_TAG }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.TECA_TAG }}-

      - name: Clone TECA
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p teca-logs
          git clone --depth 1 --branch "$TECA_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/LBL-EESA/TECA.git "$RUNNER_TEMP/teca-src"

      - name: Configure
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # TECA defaults to -march=native, but the install is cached and reused on other
          # runner CPUs ("Illegal instruction"). Setting the flags explicitly skips that default.
          CXX_FLAGS: -fPIC -std=c++17 -Wall -Wextra -Wno-unknown-pragmas -O3 -march=x86-64-v2 -mtune=generic -fno-trapping-math -fno-math-errno -fno-signaling-nans
          FC_FLAGS: -Wall -Wextra -Wno-conversion -Wno-compare-reals -DNDEBUG -O3 -march=x86-64-v2 -mtune=generic -fno-trapping-math -fno-signaling-nans -fno-math-errno
        run: |
          set -o pipefail
          mkdir -p teca-logs "$RUNNER_TEMP/teca-build"
          cd "$RUNNER_TEMP/teca-build"
          cmake "$RUNNER_TEMP/teca-src" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$TECA_PREFIX" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_Fortran_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$CXX_FLAGS" -DCMAKE_Fortran_FLAGS="$FC_FLAGS" \
            -DBUILD_TESTING=OFF -DREQUIRE_TECA_DATA=FALSE \
            -DREQUIRE_MPI=TRUE -DREQUIRE_NETCDF_MPI=FALSE \
            -DREQUIRE_PYTHON=FALSE -DTECA_HAS_PYTHON=OFF \
            -DREQUIRE_OPENSSL=FALSE \
            -DREQUIRE_NETCDF=TRUE -DREQUIRE_UDUNITS=TRUE -DREQUIRE_BOOST=TRUE \
            2>&1 | tee "$GITHUB_WORKSPACE/teca-logs/cmake.log"

      - name: Build and install
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP/teca-build"
          set -o pipefail
          cmake --build . -j2 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 5
          cmake --install . 2>&1 | tee -a "$RUNNER_TEMP/build.log" | tail -n 5

      - name: Collect build log tail
        if: always()
        run: |
          mkdir -p teca-logs
          [ -f "$RUNNER_TEMP/build.log" ] && tail -n 400 "$RUNNER_TEMP/build.log" > teca-logs/build-tail.txt || true
          [ -f "$RUNNER_TEMP/build.log" ] && gzip -c "$RUNNER_TEMP/build.log" > teca-logs/build-full.log.gz || true
          ccache -s > teca-logs/ccache.txt 2>&1 || true

      - name: Save ccache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-${{ env.TECA_TAG }}-${{ github.run_id }}

      - name: Verify teca_bayesian_ar_detect
        run: |
          mkdir -p teca-logs
          export LD_LIBRARY_PATH="$TECA_PREFIX/lib:$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          {
            echo "TECA tag: $TECA_TAG"
            "$TECA_PREFIX/bin/teca_bayesian_ar_detect" --help 2>&1
            echo "exit code: $?"
          } | tee teca-logs/verify.txt
          grep -q input_regex teca-logs/verify.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: teca-build-logs
          path: teca-logs/
          if-no-files-found: warn

  bard:
    needs: [plan, build]
    if: inputs.run_bard
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/teca/environment.yml
          environment-name: teca
          cache-environment: true
          init-shell: bash

      - name: Restore TECA install
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TECA_PREFIX }}
          key: teca-${{ env.TECA_TAG }}-generic-${{ hashFiles('tools/teca/environment.yml') }}
          fail-on-cache-miss: true

      - name: Compute IVT cache key
        id: ivtkey
        env:
          HOURS: ${{ inputs.hours }}
          AREA: ${{ inputs.area }}
        # The area is part of the key so different domains never mix. Add a version (ivt-v2-) when VARIABLES
        # or the default AREA in fetch_era5_ivt.py change.
        run: |
          tag="${AREA// /}"
          tag="${tag//,/_}"
          tag="${tag//./p}"
          echo "areatag=$tag" >> "$GITHUB_OUTPUT"
          echo "prefix=ivt-${{ matrix.year }}-${HOURS//,/_}-a${tag}-" >> "$GITHUB_OUTPUT"

      # Many years would blow the 10 GB repo cache and evict the TECA install, so the IVT cache is single-year only.
      - name: Restore fetched IVT
        if: needs.plan.outputs.single == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/ivt
          key: ${{ steps.ivtkey.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ivtkey.outputs.prefix }}

      - name: Write CDS credentials
        if: inputs.source == 'cds'
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          umask 077
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDSAPI_KEY" > ~/.cdsapirc

      - name: Fetch ERA5 and compute IVT
        timeout-minutes: 180
        env:
          YEAR: ${{ matrix.year }}
          HOURS: ${{ inputs.hours }}
          MONTHS: ${{ inputs.months }}
          SOURCE: ${{ inputs.source }}
          AREA: ${{ inputs.area }}
        run: |
          set -o pipefail
          mkdir -p teca-logs data/ivt
          python tools/teca/fetch_era5_ivt.py --year "$YEAR" --hours "$HOURS" --months "$MONTHS" \
            --source "$SOURCE" --area="${AREA// /}" --out data/ivt 2>&1 | tee teca-logs/fetch.log
          du -sh data/ivt | tee -a teca-logs/fetch.log

      - name: Drop partial downloads
        if: always()
        run: rm -rf data/ivt/raw_*

      - name: Save fetched IVT
        if: always() && needs.plan.outputs.single == 'true'
        uses: actions/cache/save@v6
        with:
          path: data/ivt
          key: ${{ steps.ivtkey.outputs.prefix }}${{ github.run_id }}

      - name: Run BARD
        env:
          YEAR: ${{ matrix.year }}
          AREA: ${{ inputs.area }}
        run: |
          set -o pipefail
          mkdir -p bard-out
          # Wrap around the globe only when the area spans the full circle (E - W >= 359).
          IFS=, read -r _ west _ east <<< "${AREA// /}"
          periodic=$(awk -v w="$west" -v e="$east" 'BEGIN { print (e - w >= 359) ? 1 : 0 }')
          echo "periodic_in_x=$periodic (area $AREA)" | tee -a teca-logs/bard.log
          export LD_LIBRARY_PATH="$TECA_PREFIX/lib:$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          "$TECA_PREFIX/bin/teca_bayesian_ar_detect" \
            --input_regex "$GITHUB_WORKSPACE/data/ivt/ivt_${YEAR}-[0-9][0-9]\.nc" \
            --ivt IVT \
            --periodic_in_x "$periodic" \
            --segment_ar_probability \
            --output_file "$GITHUB_WORKSPACE/bard-out/bard_%t%.nc" \
            --file_layout monthly \
            --n_bard_threads 2 --n_writer_threads 1 \
            --verbose 1 \
            2>&1 | tee teca-logs/bard.log
          ls -lh bard-out | tee -a teca-logs/bard.log
          if ! compgen -G "bard-out/bard_*.nc" > /dev/null; then
            echo "::error::BARD produced no bard_*.nc files in bard-out/"
            exit 1
          fi

      - name: Crop to Neuquen
        run: |
          set -o pipefail
          python tools/teca/crop_bard.py --area=-34,-74,-43,-66 --out bard-crop/ bard-out/bard_*.nc 2>&1 | tee teca-logs/crop.log
          python - <<'PY' 2>&1 | tee -a teca-logs/crop.log
          import glob, sys
          import xarray as xr
          n = 0
          for f in glob.glob("bard-crop/bard_neuquen_*.nc"):
              with xr.open_dataset(f) as ds:
                  n += ds.sizes["time"]
          print(f"crop time steps: {n}")
          if n == 0:
              sys.exit("::error::Neuquen crop has zero time steps")
          PY
          ls -lh bard-crop | tee -a teca-logs/crop.log

      - name: Remove credentials
        if: always()
        run: rm -f ~/.cdsapirc

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bard-neuquen-${{ matrix.year }}
          path: |
            bard-crop/
            teca-logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - uses: actions/upload-artifact@v7
        if: always() && inputs.keep_full
        with:
          name: bard-${{ matrix.year }}-${{ steps.ivtkey.outputs.areatag }}
          path: bard-out/
          if-no-files-found: warn
          compression-level: 6
