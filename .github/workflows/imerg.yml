# Regional IMERG V07 half-hourly for Neuquén via NASA Harmony (plan/03, F3.1). Manual, or a push to branch run/imerg-fetch.
# Needs repo secrets EARTHDATA_USERNAME / EARTHDATA_PASSWORD (Earthdata account with the GES DISC EULA accepted).
# Input `product`: "final" (default, GPM_3IMERGHH) or "late" (Late Run, GPM_3IMERGHHL, ~14 h latency, no gauge
# adjustment). They never mix: late uses its own labels (clima-nqn-imerg-late[-<YYYY-MM>]), artifacts
# (imerg-late-month-<YYYY-MM>, imerg-neuquen-late), directory (neuquen-late) and store. Input `first_month` (YYYY-MM,
# empty = 2000-06) drops earlier months from the plan.
# Work is split in small per-month chunks that save progress and resume:
#  - plan: lists which months already exist as artifacts and picks the next `max_months` missing ones (months after
#    `last_month`, default = newest complete month in NASA CMR for the product, are not requested; if CMR cannot be
#    reached it falls back to today minus 4 months for final and minus 1 month for late). Then it cancels leftover Harmony jobs of this account (labels of the product and harmony-py; safe
#    because the concurrency group allows one IMERG run at a time), except the newest job of each month in the batch.
#  - fetch: one job per month (max `jobs` at once) writes <YYYY-MM>.zarr and uploads artifact imerg-month-<YYYY-MM>
#    (late: imerg-late-month-<YYYY-MM>, 90 days). A month takes longer on NASA's side than one run: the fetch stops
#    itself after 40 min but leaves its Harmony job running (labelled clima-nqn-imerg-<YYYY-MM>); the next run reuses
#    it instead of resubmitting.
#  - continue: if months remain, dispatches the next run (chain=false disables it) with stalls=0 after a run that
#    finished a month, or stalls+1 after one that did not; after 6 runs in a row without one (~5 h) it stops and fails.
#  - combine: when nothing is missing, joins every month artifact of the product into neuquen[-late].zarr (artifact
#    imerg-neuquen[-late]); months that are absent are listed in its `missing_months` attribute.
# Legacy per-year artifacts imerg-neuquen-<year> (final only; newest non-expired one per year) count as done months too.
name: IMERG regional fetch

on:
  # A push to run/imerg-fetch runs the defaults without the workflow being on main yet.
  push:
    branches: [run/imerg-fetch]
  workflow_dispatch:
    inputs:
      years:
        description: 'Years, e.g. "2000-2026", "2014" or "2000-2005,2014"'
        default: "2000-2026"
      last_month:
        description: 'Last month to request, "YYYY-MM"; empty = newest complete month in NASA CMR'
        default: ""
      product:
        description: '"final" (GPM_3IMERGHH) or "late" (Late Run, GPM_3IMERGHHL); stored separately, never mixed'
        default: "final"
      first_month:
        description: 'First month to request, "YYYY-MM"; empty = 2000-06'
        default: ""
      max_months:
        description: "Months fetched per run"
        default: "48"
      jobs:
        description: "Months fetched in parallel (max-parallel)"
        default: "6"
      chain:
        description: "Dispatch the next run while months remain"
        default: "true"
      stalls:
        description: "Consecutive runs without a finished month (set by the chain; leave 0)"
        default: "0"

# one IMERG run at a time: plan cancels leftover Harmony jobs, which is only safe without a concurrent run
concurrency:
  group: imerg-fetch
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      remaining: ${{ steps.plan.outputs.remaining }}
      batch: ${{ steps.plan.outputs.batch }}
    defaults:
      run:
        working-directory: backend
    env:
      GH_TOKEN: ${{ github.token }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: List artifacts
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .created_at] | @tsv' \
            > "$RUNNER_TEMP/artifacts.tsv"
          wc -l "$RUNNER_TEMP/artifacts.tsv"
      - id: plan
        env:
          YEARS: ${{ inputs.years || '2000-2026' }}
          LAST: ${{ inputs.last_month || '' }}
          PRODUCT: ${{ inputs.product || 'final' }}
          FIRST: ${{ inputs.first_month || '' }}
          MAX_MONTHS: ${{ inputs.max_months || '48' }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, re, subprocess, sys, time, urllib.request, zipfile
          years, last = os.environ["YEARS"].replace(" ", ""), os.environ["LAST"].strip()
          if not re.fullmatch(r"\d{4}(-\d{4})?(,\d{4}(-\d{4})?)*", years):
              sys.exit(f"invalid years: {years!r}")
          if not re.fullmatch(r"\d+", os.environ["MAX_MONTHS"]) or int(os.environ["MAX_MONTHS"]) < 1:
              sys.exit(f"invalid max_months: {os.environ['MAX_MONTHS']!r}")
          max_months = int(os.environ["MAX_MONTHS"])
          product, first = os.environ["PRODUCT"].strip(), os.environ["FIRST"].strip()
          if product not in ("final", "late"):
              sys.exit(f"invalid product: {product!r}")
          if first and not re.fullmatch(r"\d{4}-(0[1-9]|1[0-2])", first):
              sys.exit(f"invalid first_month: {first!r}")
          first_ym = max(first, "2000-06")  # YYYY-MM sorts as text
          month_prefix = "imerg-month-" if product == "final" else "imerg-late-month-"
          if last:
              if not re.fullmatch(r"\d{4}-(0[1-9]|1[0-2])", last):
                  sys.exit(f"invalid last_month: {last!r}")
              ly, lm = map(int, last.split("-"))
          else:
              # newest granule in NASA CMR decides; IMERG Final can lag far more than the nominal 3.5 months
              cmr = os.environ.get("IMERG_CMR_URL", "https://cmr.earthdata.nasa.gov/search/granules.json")
              short = "GPM_3IMERGHH" if product == "final" else "GPM_3IMERGHHL"
              url = f"{cmr}?short_name={short}&version=07&sort_key=-start_date&page_size=1"
              latest = None
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as resp:
                          latest = json.load(resp)["feed"]["entry"][0]["time_start"]
                      latest = dt.datetime.strptime(latest[:19], "%Y-%m-%dT%H:%M:%S")
                      break
                  except Exception as e:
                      latest = None
                      print(f"CMR attempt {attempt}/3 failed: {e!r}")
                      if attempt < 3:
                          time.sleep(2)
              if latest is not None:
                  # complete month = the newest granule is the month's last one (23:30 on its last day)
                  done_month = latest.hour == 23 and latest.minute == 30 and (latest + dt.timedelta(days=1)).day == 1
                  n = latest.year * 12 + latest.month - 1 - (0 if done_month else 1)
                  print(f"last month from NASA CMR (newest granule {latest:%Y-%m-%dT%H:%M}): {n // 12}-{n % 12 + 1:02d}")
              else:
                  print("WARNING: NASA CMR unreachable; guessing last month from today (final -4, late -1 months)")
                  t = dt.date.today()
                  n = t.year * 12 + t.month - 1 - (4 if product == "final" else 1)
                  print(f"last month from today-based fallback: {n // 12}-{n % 12 + 1:02d}")
              ly, lm = divmod(n, 12)
              lm += 1
          # wanted months, clipped to first_month (never before the first available month 2000-06)
          wanted = set()
          for part in years.split(","):
              a, _, b = part.partition("-")
              lo, hi = int(a), int(b or a)
              if lo > hi or lo < 2000 or hi > 2100:
                  sys.exit(f"invalid range: {part!r}")
              for y in range(lo, hi + 1):
                  last_m = 12 if y < ly else lm if y == ly else 0
                  wanted.update(
                      f"{y:04d}-{m:02d}" for m in range(1, last_m + 1) if f"{y:04d}-{m:02d}" >= first_ym
                  )

          # newest non-expired artifact per name (created_at is ISO 8601, so it sorts as text)
          newest = {}
          tsv = os.path.join(os.environ["RUNNER_TEMP"], "artifacts.tsv")
          for line in open(tsv):
              aid, name, created = line.rstrip("\n").split("\t")
              if name not in newest or created > newest[name][1]:
                  newest[name] = (aid, created)
          done = {n[len(month_prefix):] for n in newest if re.fullmatch(re.escape(month_prefix) + r"\d{4}-\d{2}", n)}
          n_month = len(done)
          # legacy per-year artifacts only exist for final
          legacy = sorted(n for n in newest if re.fullmatch(r"imerg-neuquen-\d{4}", n)) if product == "final" else []
          for name in legacy:
              zpath = os.path.join(os.environ["RUNNER_TEMP"], name + ".zip")
              with open(zpath, "wb") as f:
                  subprocess.run(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{newest[name][0]}/zip"],
                      stdout=f, check=True,
                  )
              with zipfile.ZipFile(zpath) as z:
                  tops = {p.split("/")[0] for p in z.namelist()}
              months = {t[:-5] for t in tops if re.fullmatch(r"\d{4}-\d{2}\.zarr", t)}
              print(f"legacy {name}: {len(months)} months")
              done |= months

          missing = sorted(wanted - done)
          batch = missing[:max_months]
          print(f"month artifacts: {n_month}, legacy artifacts: {len(legacy)}, done total: {len(done)}")
          print(f"wanted: {len(wanted)}, missing: {len(missing)}, batch: {len(batch)}, remaining: {len(missing) - len(batch)}")
          print("batch:", batch)
          # a matrix cannot be empty; the placeholder is never run because has_work is false
          include = [{"month": m} for m in batch] or [{"month": "none"}]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
              f.write("has_work=" + ("true" if batch else "false") + "\n")
              f.write(f"remaining={len(missing) - len(batch)}\n")
              f.write("batch=" + ",".join(batch) + "\n")
          PY
      - name: Cancel leftover Harmony jobs
        continue-on-error: true
        env:
          BATCH: ${{ steps.plan.outputs.batch }}
          PRODUCT: ${{ inputs.product || 'final' }}
        run: |
          # shape check only, values are never printed
          for v in EARTHDATA_USERNAME EARTHDATA_PASSWORD; do
            val="${!v}"
            trimmed="$(printf '%s' "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            echo "$v: length ${#val}, edge whitespace: $([ "$val" != "$trimmed" ] && echo yes || echo no)"
            [ -n "$val" ] || { echo "$v is empty"; exit 1; }
          done
          # jobs of the months about to be fetched survive (the fetch reuses them); older duplicates and other months go
          uv run clima-nqn imerg cancel-running --product "$PRODUCT" --keep-months "$BATCH" || true
          # harmony-py labels every job it submits, ours included: keep the batch months here too
          uv run clima-nqn imerg cancel-running --product "$PRODUCT" --label harmony-py --keep-months "$BATCH" || true

  fetch:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.jobs || '6') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - timeout-minutes: 50
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          MONTH: ${{ matrix.month }}
          PRODUCT: ${{ inputs.product || 'final' }}
        run: |
          # shape check only, values are never printed
          for v in EARTHDATA_USERNAME EARTHDATA_PASSWORD; do
            val="${!v}"
            trimmed="$(printf '%s' "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            echo "$v: length ${#val}, edge whitespace: $([ "$val" != "$trimmed" ] && echo yes || echo no)"
            [ -n "$val" ] || { echo "$v is empty"; exit 1; }
          done
          uv run clima-nqn imerg fetch --product "$PRODUCT" --year "${MONTH%-*}" --months "$((10#${MONTH#*-}))" --workers 32 --parallel 1 --deadline-min 40
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ (inputs.product || 'final') == 'late' && 'imerg-late-month-' || 'imerg-month-' }}${{ matrix.month }}
          # the directory itself (not a *.zarr glob) keeps <YYYY-MM>.zarr/ at the artifact root
          path: |
            ${{ (inputs.product || 'final') == 'late' && 'backend/data/raw/imerg/neuquen-late/' || 'backend/data/raw/imerg/neuquen/' }}
            !${{ (inputs.product || 'final') == 'late' && 'backend/data/raw/imerg/neuquen-late' || 'backend/data/raw/imerg/neuquen' }}/*-raw/
            !${{ (inputs.product || 'final') == 'late' && 'backend/data/raw/imerg/neuquen-late' || 'backend/data/raw/imerg/neuquen' }}/*.tmp/
          retention-days: 90
          if-no-files-found: ignore

  continue:
    needs: [plan, fetch]
    if: >-
      always() && needs.plan.outputs.has_work == 'true' && needs.plan.outputs.remaining != '0'
      && inputs.chain != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          YEARS: ${{ inputs.years || '2000-2026' }}
          LAST: ${{ inputs.last_month || '' }}
          PRODUCT: ${{ inputs.product || 'final' }}
          FIRST: ${{ inputs.first_month || '' }}
          MAX_MONTHS: ${{ inputs.max_months || '48' }}
          JOBS: ${{ inputs.jobs || '6' }}
          STALLS: ${{ inputs.stalls || '0' }}
        run: |
          if [ "$PRODUCT" = late ]; then PREFIX=imerg-late-month-; else PREFIX=imerg-month-; fi
          n=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
                --jq '.artifacts[] | select((.name | startswith("'"$PREFIX"'")) and .expired == false and .workflow_run.id == '"$GITHUB_RUN_ID"') | .name' | wc -l)
          echo "month artifacts uploaded by this run: $n"
          if [ "$n" -ge 1 ]; then
            next=0
          else
            next=$((STALLS + 1))
            # Harmony jobs keep running between runs and a month can take ~3 h, so allow 6 idle runs (~5 h) in a row
            if [ "$STALLS" -ge 6 ]; then
              echo "no month finished in $((STALLS + 1)) consecutive runs, not chaining"
              exit 1
            fi
            echo "no progress this run (stalls so far: $STALLS), chaining anyway so the reused Harmony jobs can finish"
          fi
          gh workflow run imerg.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f years="$YEARS" -f last_month="$LAST" -f product="$PRODUCT" -f first_month="$FIRST" -f max_months="$MAX_MONTHS" -f jobs="$JOBS" -f chain=true \
            -f stalls="$next"

  combine:
    needs: [plan, fetch]
    if: always() && (needs.plan.outputs.has_work == 'false' || needs.plan.outputs.remaining == '0')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - working-directory: backend
        run: uv sync --locked
      - name: Download month and legacy artifacts
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product || 'final' }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .created_at] | @tsv' \
            > "$RUNNER_TEMP/artifacts.tsv"
          # newest artifact per name; month artifacts first so they win over legacy per-year ones (unzip -n keeps existing)
          python3 - <<'PY' > "$RUNNER_TEMP/order.txt"
          import os, re
          newest = {}
          for line in open(os.path.join(os.environ["RUNNER_TEMP"], "artifacts.tsv")):
              aid, name, created = line.rstrip("\n").split("\t")
              if name not in newest or created > newest[name][1]:
                  newest[name] = (aid, created)
          # only the product's artifacts; legacy per-year ones are final only
          if os.environ["PRODUCT"] == "late":
              patterns = (r"imerg-late-month-\d{4}-\d{2}",)
          else:
              patterns = (r"imerg-month-\d{4}-\d{2}", r"imerg-neuquen-\d{4}")
          for pattern in patterns:
              for name in sorted(n for n in newest if re.fullmatch(pattern, n)):
                  print(newest[name][0], name)
          PY
          if [ "$PRODUCT" = late ]; then DIR=data/raw/imerg/neuquen-late; else DIR=data/raw/imerg/neuquen; fi
          mkdir -p "$DIR"
          while read -r id name; do
            echo "downloading $name ($id)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/a.zip"
            unzip -qn "$RUNNER_TEMP/a.zip" -d "$DIR"
            rm "$RUNNER_TEMP/a.zip"
          done < "$RUNNER_TEMP/order.txt"
      - working-directory: backend
        env:
          PRODUCT: ${{ inputs.product || 'final' }}
        run: |
          if [ "$PRODUCT" = late ]; then SUFFIX=-late; else SUFFIX=; fi
          ls "data/raw/imerg/neuquen$SUFFIX" | head -n 400
          uv run clima-nqn imerg combine --product "$PRODUCT"
          uv run python -c "import sys, xarray as xr; ds = xr.open_zarr(sys.argv[1], chunks=None); print(ds); print(ds.attrs)" "data/raw/imerg/neuquen$SUFFIX.zarr"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ (inputs.product || 'final') == 'late' && 'imerg-neuquen-late' || 'imerg-neuquen' }}
          path: ${{ (inputs.product || 'final') == 'late' && 'backend/data/raw/imerg/neuquen-late.zarr' || 'backend/data/raw/imerg/neuquen.zarr' }}
          retention-days: 90
          if-no-files-found: error
      # Durable copy: artifacts expire after 90 days. Zips the combined Zarr (same layout as the artifact zip) to the
      # private R2 bucket nqn-raw as imerg/<product>-v07/neuquen_<first>_<last>.zarr.zip. Skipped without R2 secrets.
      - name: Back up combined Zarr to R2
        working-directory: backend
        env:
          PRODUCT: ${{ inputs.product || 'final' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: nqn-raw
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets not set, skipping backup"; exit 0
          fi
          if [ "$PRODUCT" = late ]; then SUFFIX=-late; else SUFFIX=; fi
          STORE="data/raw/imerg/neuquen$SUFFIX.zarr"
          ZIP="$RUNNER_TEMP/backup.zarr.zip"
          (cd "$STORE" && zip -qr "$ZIP" .)
          uv run python - "$STORE" "$ZIP" <<'PY'
          import hashlib, os, sys
          import xarray as xr
          from clima_nqn.publish import make_client
          store, zpath = sys.argv[1], sys.argv[2]
          period = xr.open_zarr(store, consolidated=False, chunks=None).attrs["period"]
          first, last = (p[:7] for p in period.split("/"))
          key = f"imerg/{os.environ['PRODUCT']}-v07/neuquen_{first}_{last}.zarr.zip"
          data = open(zpath, "rb").read()
          sha = hashlib.sha256(data).hexdigest()
          client = make_client(
              os.environ["R2_ACCOUNT_ID"], os.environ["R2_ACCESS_KEY_ID"], os.environ["R2_SECRET_ACCESS_KEY"]
          )
          bucket = os.environ["R2_BACKUP_BUCKET"]
          client.put_object(Bucket=bucket, Key=key, Body=data, ContentType="application/zip", Metadata={"sha256": sha})
          back = client.get_object(Bucket=bucket, Key=key)["Body"].read()
          if hashlib.sha256(back).hexdigest() != sha:
              sys.exit(f"checksum mismatch after upload of {key}")
          print(f"backed up {key}: {len(data)} bytes, sha256 {sha}")
          PY
