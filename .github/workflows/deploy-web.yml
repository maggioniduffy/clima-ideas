name: Deploy web

# Builds the viewer against the public R2 bucket and deploys it as a Cloudflare Worker with static assets
# (web/wrangler.jsonc, worker "clima-nqn-web"). Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit) and
# reuses R2_ACCOUNT_ID as the Cloudflare account id.

on:
  # workflow_dispatch only works once this file is on the default branch; until then, a push to the
  # working branch that touches web/ or this file deploys.
  push:
    branches: [main, fm/epic-babbage-gwli3b]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
    inputs:
      data_url:
        description: Public base URL of the published layers (VITE_DATA_URL)
        default: https://pub-89e22e4a31da4ba2bde9dd24522147a9.r2.dev
        required: true

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        env:
          VITE_DATA_URL: ${{ inputs.data_url || 'https://pub-89e22e4a31da4ba2bde9dd24522147a9.r2.dev' }}
          # CARTO basemaps key (public in the bundle; restrict it to the site's domain in the CARTO dashboard).
          # Unset: the viewer builds without a basemap.
          VITE_CARTO_KEY: ${{ secrets.CARTO_BASEMAPS_KEY }}
        run: pnpm build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1
          fi
          npx -y wrangler@4.166.0 deploy
