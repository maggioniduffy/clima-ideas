# Build and run environment for TECA 6.0.0 (C++ apps only: BARD; MPI on, since 6.0.0 does not compile without it; no Python bindings)
# plus the Python tooling used to fetch ERA5 and compute IVT.
name: teca
channels:
  - conda-forge
dependencies:
  - python=3.11
  - compilers          # gcc, g++, gfortran (TECA builds Fortran sources)
  - cmake>=3.20,<4  # TECA 6.0.0 submodules use cmake_minimum_required < 3.5, removed in CMake 4
  - make
  - ccache
  - pkg-config
  - swig               # TECA's CMakeLists requires swig to be found even without Python
  - openmpi
  - libnetcdf=*=nompi_*
  - hdf5=*=nompi_*
  - udunits2
  - libboost-devel     # program_options
  - openssl
  - zlib
  # fetch_era5_ivt.py
  - numpy
  - xarray
  - netcdf4
  - cdsapi
