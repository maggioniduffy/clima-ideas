[project]
name = "clima-nqn"
version = "0.1.0"
description = "Retrospective extreme-rain analysis for Neuquén"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pandas",
    "pyarrow",
    "httpx",
    "typer",
]

[project.scripts]
clima-nqn = "clima_nqn.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clima_nqn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselected by default)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
