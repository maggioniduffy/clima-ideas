[project]
name = "clima-nqn"
version = "0.1.0"
description = "Retrospective extreme-rain analysis for Neuquén"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pandas",
    "pyarrow",
    "httpx",
    "typer",
    "rasterio>=1.5.2",
    "numpy>=2.5.4",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
    "gcsfs>=2026.10.1",
    "netcdf4>=1.7.5.1.post1",
    "pyextremes>=2.6.1",
    "boto3>=1.44.1",
]

[project.scripts]
clima-nqn = "clima_nqn.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]
# Streamflow LSTM (F2.5): optional, CPU-only wheels; `uv sync --group ml`. Not installed by CI or the API.
ml = ["torch"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clima_nqn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselected by default)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
